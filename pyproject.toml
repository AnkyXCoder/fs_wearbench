[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-wearbench"
version = "0.1.0"
description = "Measurement-first flash wear-leveling and endurance estimator for LittleFS, NVS and ZMS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ankit Modi", email = "ankit.5036@gmail.com" }]
dependencies = ["pyyaml>=6.0", "click>=8.0", "rich>=13.0", "jinja2>=3.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
fs-wearbench = "wearbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
